#cloud-config
# Cloud-init configuration for HN Jobs Worker VM
# This script runs on first boot to set up the Temporal worker environment

# Allow hostname to be set dynamically in setup script
preserve_hostname: false

# Create deploy user
users:
  - name: deploy
    groups: [wheel]
    shell: /bin/bash
    ssh_authorized_keys:
      - ${SSH_PUBLIC_KEY}

# Install packages
packages:
  - git
  - curl
  - unzip
  - htop
  - jq

# Write configuration files
write_files:
  # Systemd service for the worker
  - path: /etc/systemd/system/hnjobs-worker.service
    owner: root:root
    permissions: '0644'
    content: |
      [Unit]
      Description=HN Jobs Temporal Worker
      After=network.target

      [Service]
      Type=simple
      User=deploy
      Group=deploy
      WorkingDirectory=/opt/hnjobs/packages/worker
      ExecStart=/home/deploy/.bun/bin/bun run src/index.ts
      Restart=on-failure
      RestartSec=10
      StandardOutput=journal
      StandardError=journal
      Environment=NODE_ENV=production
      EnvironmentFile=-/opt/hnjobs/packages/worker/.env

      # Resource limits
      LimitNOFILE=65535

      [Install]
      WantedBy=multi-user.target

  # Environment file template (moved into repo after clone)
  - path: /opt/hnjobs/.env.worker.template
    owner: deploy:deploy
    permissions: '0600'
    content: |
      # Temporal Configuration (use Temporal VM's IP or internal DNS)
      TEMPORAL_ADDRESS=hnjobs-temporal:7233
      TEMPORAL_NAMESPACE=default

      # API Configuration
      API_URL=https://api.hnjobs.example.com
      API_TOKEN=your-api-token

      # Anthropic API for AI processing
      ANTHROPIC_API_KEY=your-anthropic-key

  # Sudoers entry for deploy user to restart service
  - path: /etc/sudoers.d/deploy-hnjobs
    owner: root:root
    permissions: '0440'
    content: |
      deploy ALL=(ALL) NOPASSWD: /bin/systemctl restart hnjobs-worker
      deploy ALL=(ALL) NOPASSWD: /bin/systemctl stop hnjobs-worker
      deploy ALL=(ALL) NOPASSWD: /bin/systemctl start hnjobs-worker
      deploy ALL=(ALL) NOPASSWD: /bin/systemctl status hnjobs-worker

  # Setup script that runs after cloud-init
  - path: /opt/setup-worker.sh
    owner: root:root
    permissions: '0755'
    content: |
      #!/bin/bash
      set -e

      echo "=== HN Jobs Worker Setup Script ==="

      # Install Bun for deploy user
      echo "Installing Bun..."
      sudo -u deploy bash -c 'curl -fsSL https://bun.sh/install | bash'

      # Add bun to PATH for deploy user
      echo 'export BUN_INSTALL="$HOME/.bun"' >> /home/deploy/.bashrc
      echo 'export PATH="$BUN_INSTALL/bin:$PATH"' >> /home/deploy/.bashrc

      # Set hostname based on OCI instance display name
      echo "Setting hostname..."
      INSTANCE_NAME=$(curl -sf -H "Authorization: Bearer Oracle" http://169.254.169.254/opc/v2/instance/ | jq -r '.displayName // empty' || true)
      if [ -n "$INSTANCE_NAME" ]; then
        hostnamectl set-hostname "$INSTANCE_NAME"
      else
        echo "Could not fetch instance display name; leaving hostname as-is."
      fi

      # Prepare application directory
      echo "Preparing application directory..."
      mkdir -p /opt/hnjobs
      chown deploy:deploy /opt/hnjobs

      # Clone repository if missing
      if [ ! -d /opt/hnjobs/.git ]; then
        if [ -z "$(ls -A /opt/hnjobs)" ]; then
          echo "Cloning repository..."
          sudo -u deploy git clone ${REPO_URL} /opt/hnjobs
        else
          echo "WARNING: /opt/hnjobs is not empty; skipping clone."
        fi
      fi

      # Move template into repo if available
      if [ -d /opt/hnjobs/packages/worker ]; then
        if [ -f /opt/hnjobs/.env.worker.template ]; then
          mv /opt/hnjobs/.env.worker.template /opt/hnjobs/packages/worker/.env.template
          chown deploy:deploy /opt/hnjobs/packages/worker/.env.template
          chmod 600 /opt/hnjobs/packages/worker/.env.template
        fi
      else
        echo "WARNING: /opt/hnjobs/packages/worker not found; template remains at /opt/hnjobs/.env.worker.template"
      fi

      # Install Playwright dependencies for web scraping
      echo "Installing Playwright dependencies..."
      dnf install -y \
        alsa-lib \
        atk \
        at-spi2-atk \
        cups-libs \
        libdrm \
        libXcomposite \
        libXdamage \
        libXext \
        libXrandr \
        mesa-libgbm \
        nss \
        pango \
        xorg-x11-fonts-Type1 \
        xorg-x11-fonts-misc || true

      # Enable the service (but don't start - needs .env first)
      echo "Enabling hnjobs-worker service..."
      systemctl daemon-reload
      systemctl enable hnjobs-worker

      echo "=== Worker setup complete! ==="
      echo "Next steps:"
      echo "1. If repo not cloned, clone: git clone ${REPO_URL} /opt/hnjobs"
      echo "2. Create .env file: cp /opt/hnjobs/packages/worker/.env.template /opt/hnjobs/packages/worker/.env"
      echo "3. Edit .env with your values"
      echo "4. Install dependencies: cd /opt/hnjobs && bun install"
      echo "5. Start service: sudo systemctl start hnjobs-worker"

# Run commands
runcmd:
  # Update system
  - dnf update -y

  # Set timezone
  - timedatectl set-timezone UTC

  # Configure firewall
  - firewall-cmd --permanent --add-service=ssh
  - firewall-cmd --reload

  # Install OCI Monitoring Agent
  - |
    echo "Installing OCI Unified Monitoring Agent..."
    rpm -ivh https://objectstorage.us-phoenix-1.oraclecloud.com/n/axqc4ws2v99q/b/unified-monitoring-agent/o/unified-monitoring-agent-latest.rpm || true
    systemctl enable unified-monitoring-agent
    systemctl start unified-monitoring-agent

  # Run the setup script
  - /opt/setup-worker.sh

  # Log completion
  - echo "Cloud-init completed at $(date)" >> /var/log/cloud-init-complete.log

# Final message
final_message: |
  HN Jobs Worker VM initialization complete!
  System boot took $UPTIME seconds.

  SSH in as: ssh deploy@<public-ip>
  Check logs: sudo journalctl -u hnjobs-worker -f
