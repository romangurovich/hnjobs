#cloud-config
# Cloud-init configuration for HN Jobs Temporal Server VM
# ARM A1.Flex: 2 OCPUs, 12GB RAM
# This script runs on first boot to set up Temporal with PostgreSQL

# Set hostname
hostname: hnjobs-temporal

# Create deploy user
users:
  - name: deploy
    groups: [wheel, docker]
    sudo: ['ALL=(ALL) NOPASSWD:ALL']
    shell: /bin/bash
    ssh_authorized_keys:
      - ${SSH_PUBLIC_KEY}

# Install packages
packages:
  - git
  - curl
  - unzip
  - htop
  - jq
  - yum-utils

# Write configuration files
write_files:
  # Docker Compose file for Temporal
  - path: /opt/temporal/docker-compose.yaml
    owner: root:root
    permissions: '0644'
    content: |
      version: "3.8"
      
      services:
        postgresql:
          image: postgres:15-alpine
          container_name: temporal-postgresql
          environment:
            POSTGRES_USER: temporal
            POSTGRES_PASSWORD: temporal_password_change_me
            POSTGRES_DB: temporal
          volumes:
            - postgresql_data:/var/lib/postgresql/data
          networks:
            - temporal-network
          restart: unless-stopped
          healthcheck:
            test: ["CMD-SHELL", "pg_isready -U temporal"]
            interval: 10s
            timeout: 5s
            retries: 5
        
        temporal:
          image: temporalio/auto-setup:1.24
          container_name: temporal-server
          depends_on:
            postgresql:
              condition: service_healthy
          environment:
            - DB=postgresql
            - DB_PORT=5432
            - POSTGRES_USER=temporal
            - POSTGRES_PWD=temporal_password_change_me
            - POSTGRES_SEEDS=postgresql
            - DYNAMIC_CONFIG_FILE_PATH=/etc/temporal/config/dynamicconfig/docker.yaml
          ports:
            - "7233:7233"
          volumes:
            - ./dynamicconfig:/etc/temporal/config/dynamicconfig
          networks:
            - temporal-network
          restart: unless-stopped
          healthcheck:
            test: ["CMD", "temporal", "operator", "cluster", "health"]
            interval: 30s
            timeout: 10s
            retries: 5
        
        temporal-ui:
          image: temporalio/ui:2.26
          container_name: temporal-ui
          depends_on:
            - temporal
          environment:
            - TEMPORAL_ADDRESS=temporal:7233
            - TEMPORAL_CORS_ORIGINS=http://localhost:3000
          ports:
            - "8080:8080"
          networks:
            - temporal-network
          restart: unless-stopped
        
        temporal-admin-tools:
          image: temporalio/admin-tools:1.24
          container_name: temporal-admin-tools
          depends_on:
            - temporal
          environment:
            - TEMPORAL_ADDRESS=temporal:7233
          networks:
            - temporal-network
          stdin_open: true
          tty: true
      
      volumes:
        postgresql_data:
      
      networks:
        temporal-network:
          driver: bridge

  # Dynamic config for Temporal
  - path: /opt/temporal/dynamicconfig/docker.yaml
    owner: root:root
    permissions: '0644'
    content: |
      # Temporal dynamic configuration
      # See: https://docs.temporal.io/references/dynamic-configuration
      
      # Increase workflow execution history size limit
      history.maximumSignalsPerExecution:
        - value: 10000
          constraints: {}
      
      # Frontend settings
      frontend.keepAliveMaxConnectionAge:
        - value: "5m"
          constraints: {}

  # Systemd service for Temporal stack
  - path: /etc/systemd/system/temporal.service
    owner: root:root
    permissions: '0644'
    content: |
      [Unit]
      Description=Temporal Server Stack
      Requires=docker.service
      After=docker.service
      
      [Service]
      Type=oneshot
      RemainAfterExit=yes
      WorkingDirectory=/opt/temporal
      ExecStart=/usr/bin/docker compose up -d
      ExecStop=/usr/bin/docker compose down
      ExecReload=/usr/bin/docker compose restart
      
      [Install]
      WantedBy=multi-user.target

  # Firewalld service for Temporal
  - path: /etc/firewalld/services/temporal.xml
    owner: root:root
    permissions: '0644'
    content: |
      <?xml version="1.0" encoding="utf-8"?>
      <service>
        <short>Temporal</short>
        <description>Temporal gRPC and UI ports</description>
        <port protocol="tcp" port="7233"/>
        <port protocol="tcp" port="8080"/>
      </service>

# Run commands on first boot
runcmd:
  # Install Docker
  - |
    echo "Installing Docker..."
    yum-config-manager --add-repo https://download.docker.com/linux/centos/docker-ce.repo
    dnf install -y docker-ce docker-ce-cli containerd.io docker-compose-plugin
    systemctl enable docker
    systemctl start docker
    usermod -aG docker deploy
    echo "Docker installed."

  # Create directories
  - |
    mkdir -p /opt/temporal/dynamicconfig
    chown -R deploy:deploy /opt/temporal

  # Configure firewall
  - |
    echo "Configuring firewall..."
    firewall-cmd --permanent --add-service=ssh
    firewall-cmd --permanent --new-service=temporal 2>/dev/null || true
    firewall-cmd --permanent --service=temporal --add-port=7233/tcp
    firewall-cmd --permanent --service=temporal --add-port=8080/tcp
    firewall-cmd --permanent --add-service=temporal
    firewall-cmd --reload
    echo "Firewall configured."

  # Generate random password for PostgreSQL
  - |
    TEMPORAL_DB_PASSWORD=$(openssl rand -base64 24 | tr -dc 'a-zA-Z0-9' | head -c 32)
    sed -i "s/temporal_password_change_me/${TEMPORAL_DB_PASSWORD}/g" /opt/temporal/docker-compose.yaml
    echo "TEMPORAL_DB_PASSWORD=${TEMPORAL_DB_PASSWORD}" >> /opt/temporal/.env
    chmod 600 /opt/temporal/.env

  # Enable and start Temporal service
  - |
    echo "Starting Temporal..."
    systemctl daemon-reload
    systemctl enable temporal
    systemctl start temporal
    echo "Temporal started."

  # Wait for Temporal to be ready
  - |
    echo "Waiting for Temporal to initialize..."
    sleep 30
    for i in {1..30}; do
      if docker exec temporal-server temporal operator cluster health 2>/dev/null; then
        echo "Temporal is ready!"
        break
      fi
      echo "Waiting for Temporal... ($i/30)"
      sleep 10
    done

  # Log completion
  - |
    echo "=========================================="
    echo "Temporal VM setup complete!"
    echo "Temporal gRPC: $(hostname -I | awk '{print $1}'):7233"
    echo "Temporal UI:   http://$(hostname -I | awk '{print $1}'):8080"
    echo "=========================================="
