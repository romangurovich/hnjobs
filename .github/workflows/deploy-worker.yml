name: Deploy Worker

on:
  push:
    branches: [main]
    paths:
      - packages/worker/**
      - packages/core/**
      - .github/workflows/deploy-worker.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Worker ${{ matrix.worker }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    strategy:
      matrix:
        worker: [1, 2]
        include:
          - worker: 1
            host_secret: ORACLE_WORKER_1_HOST
          - worker: 2
            host_secret: ORACLE_WORKER_2_HOST
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets[matrix.host_secret] }}
          username: deploy
          key: ${{ secrets.ORACLE_WORKER_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/hnjobs
            git fetch origin main
            git switch main || git switch -c main --track origin/main
            git pull --ff-only origin main
            bun install --frozen-lockfile
            sudo systemctl restart hnjobs-worker
            sudo systemctl is-active --quiet hnjobs-worker
