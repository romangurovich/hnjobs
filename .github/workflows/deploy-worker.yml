name: Deploy Worker

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  check-changes:
    name: Check for changes
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    outputs:
      should_deploy: ${{ steps.changes.outputs.should_deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check for relevant changes
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_deploy=true" >> $GITHUB_OUTPUT
          else
            CHANGED=$(git diff --name-only HEAD~1 HEAD | grep -E '^packages/(worker|core)/' || true)
            if [ -n "$CHANGED" ]; then
              echo "should_deploy=true" >> $GITHUB_OUTPUT
            else
              echo "should_deploy=false" >> $GITHUB_OUTPUT
            fi
          fi

  deploy:
    name: Deploy to Worker ${{ matrix.worker }}
    runs-on: ubuntu-latest
    needs: check-changes
    if: needs.check-changes.outputs.should_deploy == 'true'
    strategy:
      matrix:
        worker: [1, 2]
        include:
          - worker: 1
            host_secret: ORACLE_WORKER_1_HOST
          - worker: 2
            host_secret: ORACLE_WORKER_2_HOST
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets[matrix.host_secret] }}
          username: deploy
          key: ${{ secrets.ORACLE_WORKER_SSH_KEY }}
          script: |
            cd /opt/hnjobs
            git fetch origin main
            git reset --hard origin/main
            bun install --frozen-lockfile
            sudo systemctl restart hnjobs-worker
