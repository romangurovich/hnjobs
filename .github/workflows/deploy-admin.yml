name: Deploy Admin

on:
  push:
    branches: [main]
    paths:
      - packages/admin/**
      - .github/workflows/deploy-admin.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-admin-production
  cancel-in-progress: false

jobs:
  build:
    name: Build Admin UI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Admin UI
        run: bun run build
        working-directory: packages/admin/ui

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: admin-ui-dist
          path: packages/admin/ui/dist
          retention-days: 1

  deploy:
    name: Deploy to Oracle Cloud VM
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    environment: production
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: admin-ui-dist
          path: admin-ui-dist

      - name: Set up SSH
        env:
          ADMIN_HOST: ${{ secrets.ORACLE_ADMIN_HOST }}
          ADMIN_SSH_KEY: ${{ secrets.ORACLE_ADMIN_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$ADMIN_SSH_KEY" | tr -d '\r' > ~/.ssh/oracle_admin_key
          chmod 600 ~/.ssh/oracle_admin_key
          ssh-keyscan -T 30 -H "$ADMIN_HOST" >> ~/.ssh/known_hosts

      - name: Deploy code via SSH
        env:
          ADMIN_HOST: ${{ secrets.ORACLE_ADMIN_HOST }}
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -i ~/.ssh/oracle_admin_key \
            -o BatchMode=yes \
            -o ConnectTimeout=30 \
            -o StrictHostKeyChecking=yes \
            "deploy@${ADMIN_HOST}" <<'EOF'
          set -euo pipefail
          cd /opt/hnjobs
          git fetch origin main
          git switch main || git switch -c main --track origin/main
          git pull --ff-only origin main
          bun install --frozen-lockfile
          EOF

      - name: Copy Admin UI build
        env:
          ADMIN_HOST: ${{ secrets.ORACLE_ADMIN_HOST }}
        shell: bash
        run: |
          set -euo pipefail
          scp \
            -i ~/.ssh/oracle_admin_key \
            -o BatchMode=yes \
            -o ConnectTimeout=30 \
            -o StrictHostKeyChecking=yes \
            -r admin-ui-dist/. \
            "deploy@${ADMIN_HOST}:/opt/hnjobs/packages/admin/ui/dist/"

      - name: Restart service
        env:
          ADMIN_HOST: ${{ secrets.ORACLE_ADMIN_HOST }}
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -i ~/.ssh/oracle_admin_key \
            -o BatchMode=yes \
            -o ConnectTimeout=30 \
            -o StrictHostKeyChecking=yes \
            "deploy@${ADMIN_HOST}" <<'EOF'
          set -euo pipefail
          sudo systemctl restart hnjobs-admin
          sudo systemctl is-active --quiet hnjobs-admin
          EOF
