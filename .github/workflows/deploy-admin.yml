name: Deploy Admin

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    name: Check for changes
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    outputs:
      should_deploy: ${{ steps.changes.outputs.should_deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check for relevant changes
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_deploy=true" >> $GITHUB_OUTPUT
          else
            CHANGED=$(git diff --name-only HEAD~1 HEAD | grep -E '^packages/admin/' || true)
            if [ -n "$CHANGED" ]; then
              echo "should_deploy=true" >> $GITHUB_OUTPUT
            else
              echo "should_deploy=false" >> $GITHUB_OUTPUT
            fi
          fi

  build:
    name: Build Admin UI
    runs-on: ubuntu-latest
    needs: check
    if: needs.check.outputs.should_deploy == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Admin UI
        run: bun run build
        working-directory: packages/admin/ui

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: admin-ui-dist
          path: packages/admin/ui/dist
          retention-days: 1

  deploy:
    name: Deploy to Oracle Cloud VM
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: admin-ui-dist
          path: admin-ui-dist

      - name: Deploy code via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_ADMIN_HOST }}
          username: deploy
          key: ${{ secrets.ORACLE_ADMIN_SSH_KEY }}
          script: |
            cd /opt/hnjobs
            git fetch origin main
            git reset --hard origin/main
            bun install --frozen-lockfile

      - name: Copy Admin UI build
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ORACLE_ADMIN_HOST }}
          username: deploy
          key: ${{ secrets.ORACLE_ADMIN_SSH_KEY }}
          source: admin-ui-dist/*
          target: /opt/hnjobs/packages/admin/ui/dist
          strip_components: 1

      - name: Restart service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_ADMIN_HOST }}
          username: deploy
          key: ${{ secrets.ORACLE_ADMIN_SSH_KEY }}
          script: sudo systemctl restart hnjobs-admin
