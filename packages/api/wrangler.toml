name = "hnjobs-api"
main = "src/index.ts"
compatibility_date = "2024-01-01" # Adjust as needed
compatibility_flags = ["nodejs_compat"]

[vars]
ALLOWED_ORIGINS = "http://localhost:5173,http://localhost:5174,http://localhost:5175,https://hnjobs.0to1.pro"

# API_TOKEN must be set as a secret (not in vars):
#   wrangler secret put API_TOKEN
# This token is required for authenticated mutations (job.save, job.clearAll)

[[d1_databases]]
binding = "DB"
database_name = "hnjobs-db"
database_id = "4b9236d5-bae7-4daf-baa8-ad50a90382f9"